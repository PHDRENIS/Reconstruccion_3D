# Config Fine-Tune YOLO-seg para IR (single-class)
# Modelo base: yolo11x-sunrgbd-seg.pt (pre-entrenado SUNRGBD, 0.919 mAP50)

train:
  epochs: 60
  batch: 16
  imgsz: 640
  device: "cuda:0"
  workers: 8

  # Fine-tune: lr bajo, sin destruir pesos pre-entrenados
  lr0: 0.0005
  lrf: 0.001
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  cos_lr: true
  close_mosaic: 10
  patience: 30

  # Augmentation adaptada a IR (sin color, solo brillo)
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.2
  degrees: 5.0
  translate: 0.1
  scale: 0.25
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 0.5
  mixup: 0.0
  copy_paste: 0.0

model:
  base: "models/yolo11x-sunrgbd-seg.pt"  # <-- EDITAR: antes /zfs-home/202501029N/Terminal/FV2/...
  base_fallback: "yolo11x-seg.pt"  # descarga automática de ultralytics
  output: "outputs/yolo_ir_finetuned.pt"

pseudolabels:
  conf: 0.3
  min_area: 500
  depth_percentile: 80
  output_dir: "outputs/pseudolabels"

paths:
  ir_images: "data/SUNRGBD/Train/rgb"  # <-- EDITAR: antes /zfs-home/.../images
  depth_maps: "data/SUNRGBD/Train/depth_input"
  data_dir: "data/yolo_data"
